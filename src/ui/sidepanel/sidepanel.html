<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Snapfill</title>
  <link rel="stylesheet" href="sidepanel.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">⚡</span>
      <span class="title">Snapfill</span>
    </div>
    <button id="settingsBtn" class="icon-btn" title="Settings">⚙️</button>
  </header>

  <section class="fill">
    <button id="fillBtn" class="primary wide">⚡ Fill this form</button>
    <p class="hint">Maps your saved profile to the form on this page, then asks you to confirm. Passwords are never filled and nothing is submitted automatically.</p>
    <div id="fillPreview" class="preview" hidden></div>
    <p id="fillStatus" class="status" role="status"></p>
  </section>

  <section class="setup">
    <p class="hint">First time? Open <button id="openSettings" class="link-btn">Settings</button> to add your profile (name, email, address…) and pick a model. Your profile is encrypted on this device.</p>
  </section>

  <script type="module" src="sidepanel.js"></script>
</body>
</html>
